name: Portable container

on:
  pull_request:
  push:
    branches: [main, "feat/portable-docker"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Record pinned base and actual runner/builder versions
        run: |
          bash scripts/container-toolchain.sh
          printf 'Runner: %s %s\n' "${ImageOS:-unknown}" "${ImageVersion:-unknown}"
          docker version
          docker compose version
          docker buildx version
      - name: Fresh-checkout Docker-only end-to-end verification
        run: bash scripts/verify-container.sh
