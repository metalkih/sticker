name: README screenshots
on:
  pull_request:
    paths:
      - "scripts/capture-readme.mjs"
      - ".github/workflows/sticker-readme-capture.yml"
      - "client/**"
      - "server/**"
      - "package*.json"
permissions:
  contents: read
concurrency:
  group: readme-capture-${{ github.ref }}
  cancel-in-progress: true
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Install Korean fonts
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - name: Capture actual app using isolated fictional data
        run: node scripts/capture-readme.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sticker-readme-screenshots
          path: docs/screenshots/*.png
          if-no-files-found: error
          retention-days: 7
